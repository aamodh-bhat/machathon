event:
  name: "Assam flood 2022 (Silchar)"
  aoi_bbox: [92.65, 24.70, 92.95, 24.95]   # [lon_min, lat_min, lon_max, lat_max]
  onset_date: "2022-06-15"                 # VERIFY exact date & cite ASDMA/IMD report
  onset_source: "VERIFY: ASDMA / IMD Assam June 2022 flood report"
  window_days_before: 30
  window_days_after: 30
  coverage_threshold: 0.80
  s1_collection: "sentinel-1-rtc"

flood_model:
  features: [vv_db, vh_db, vv_minus_vh, local_mean, local_std]
  rf_n_estimators: 200
  class_weight: balanced

loss:                                   # all ASSUMPTION unless sourced
  crop_value_inr_per_ha: 50000          # ASSUMPTION: source from state agri dept / MSP x yield
  crop_loss_ratio: 0.5                  # ASSUMPTION: flooded != destroyed
  value_inr_per_m2: 10000               # ASSUMPTION
  builtup_damage_ratio: 0.2             # ASSUMPTION
  sum_insured_inr_per_ha: 40000         # ASSUMPTION: VERIFY against scheme rates
  insured_fraction: 0.3                 # ASSUMPTION

delay_cost:
  annual_borrowing_rate: 0.07           # ASSUMPTION: VERIFY (farm credit rate)
  relief_budget_inr: 100000000          # ASSUMPTION
  misallocation_rate_per_day: 0.01      # ASSUMPTION
  max_misallocation_fraction: 0.30      # ASSUMPTION
  intimation_window_hours: 72           # VERIFY current scheme rules
  share_claims_at_risk_if_late: 0.2     # ASSUMPTION

whatif:
  events_per_year: 2                    # ASSUMPTION, slider
  configs:
    satellite_only:   {gap_days: FROM_M5, annual_cost_inr: 0}
    commercial_sar:   {gap_days: 1.0,  annual_cost_inr: 0}   # ASSUMPTION + VERIFY, fill in
    haps_sar:         {gap_days: 0.1,  annual_cost_inr: 0}   # ASSUMPTION + VERIFY, fill in
    drone_verify:     {gap_days: FROM_M5, annual_cost_inr: 0} # verification layer
  haps:
    altitude_km: 20
    min_elevation_deg: 30               # coverage radius ≈ 35 km